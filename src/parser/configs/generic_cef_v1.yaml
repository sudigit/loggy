# Source: ANY device emitting ArcSight Common Event Format (CEF)
# Check Point, Fortinet, Imperva, Trend Micro, Barracuda, Sophos, F5, ... all export CEF.
# Vendor/product are read from the CEF header itself, so one config covers them all.
#   <134>Sep 16 10:22:01 cp-mgmt CEF:0|Check Point|VPN-1 & FireWall-1|R81|Drop|Drop|5|src=203.0.113.19 spt=51820 dst=10.1.2.15 dpt=22 proto=TCP act=Drop rt=1758017521000
# Vendor-specific CEF configs can be added with a higher priority to refine this mapping.
source_id: generic_cef
version: v1
log_name: cef
product: {name: CEF, vendor_name: unknown}
priority: 10

fingerprint:
  type: regex
  pattern: 'CEF:\d+\|'

tokenize:
  type: cef

ocsf:
  class_uid: 4001          # Network Activity (events without endpoints fall through to generic_cef_base)
  activity: Traffic

mapping:
  fields:
    device_vendor: metadata.product.vendor_name
    device_product: metadata.product.name
    device_version: metadata.product.version
    signature_id: metadata.event_code
    name: message
    severity: severity_id
    src: src_endpoint.ip
    spt: src_endpoint.port
    shost: src_endpoint.hostname
    smac: src_endpoint.mac
    dst: dst_endpoint.ip
    dpt: dst_endpoint.port
    dhost: dst_endpoint.hostname
    dmac: dst_endpoint.mac
    proto: connection_info.protocol_name
    act: disposition
    suser: actor.user.name
    deviceInboundInterface: src_endpoint.interface_name
    deviceOutboundInterface: dst_endpoint.interface_name
    in: traffic.bytes_in
    out: traffic.bytes_out
    request: http_request.url.url_string
    requestMethod: http_request.http_method
    dvchost: device.hostname
    dvc: device.ip
  values:
    severity: {0: 1, 1: 1, 2: 1, 3: 2, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 5, 10: 5, low: 2, medium: 3, high: 4, very-high: 5, unknown: 0}
    act: {accept: Allowed, allow: Allowed, allowed: Allowed, permit: Allowed, pass: Allowed, deny: Blocked, denied: Blocked, drop: Dropped, dropped: Dropped, block: Blocked, blocked: Blocked, reject: Blocked, alert: Detected, detect: Detected}
  types:
    traffic.bytes_in: int
    traffic.bytes_out: int
  lookups:
    - {from: act, to: activity_name, map: {deny: Refuse, denied: Refuse, drop: Refuse, dropped: Refuse, block: Refuse, blocked: Refuse, reject: Refuse}, default: Traffic}
  timestamp:
    source: rt
    format: [epoch_ms, "%b %d %Y %H:%M:%S", "%b %d %H:%M:%S %Y", iso8601]
    fallback: envelope
