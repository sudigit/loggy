services:
  ulpf:
    build: .
    ports:
      - "5514:5514/udp"
      - "8080:8080/tcp"
    volumes:
      - ./data:/app/data
    environment:
      - ULPF_DLQ_THRESHOLD=3
      - ULPF_REDIS_URL=redis://redis:6379/0
      - ULPF_MINIO_ENDPOINT=minio:9000
      - ULPF_MINIO_ACCESS_KEY=minioadmin
      - ULPF_MINIO_SECRET_KEY=minioadmin
      - ULPF_MINIO_BUCKET=ulpf-raw-events
      # If you have a local Ollama running on the host for self-heal:
      # - ULPF_OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped
